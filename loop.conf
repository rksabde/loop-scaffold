# ─────────────────────────────────────────────────────────────
# loop.conf — the ONLY file you edit per project.
# Sourced by every loop/*.sh and by loop/gate.sh (the edit hook).
# ─────────────────────────────────────────────────────────────

# --- Verification commands (leave empty "" to skip one) ---------
# These run as the inner self-correction gate after every agent edit,
# and are what your plan Acceptance checkboxes should reference.
LINT_CMD="npm run lint --silent"
TEST_CMD="npm test --silent"
TYPECHECK_CMD=""                 # e.g. "npm run typecheck --silent" or "tsc --noEmit"

# --- Model routing (per-role engine selection) ------------------
# Engine routing now lives in .env (machine-specific) — see .env.example.
#   LOOP_TOOL=claude|codex|opencode         (default claude)
#   LOOP_ENGINE_DEFAULT="frontier:high"     (every role unset → this)
#   LOOP_ENGINE_ENGINEER / _RESEARCHER / _VERIFIER ...  (per-role override)
# Tiers: high|mid|low (opus|sonnet|haiku aliased). Providers: frontier|glm|local.
# Default (no .env): everything runs on frontier:high (= your real Claude). The
# verifier is pinned to frontier even if the default is cheap. Resolver: loop/engine.sh.

# --- Per-plan budget caps (stop runaway loops) ------------------
# Claude Code's headless kill switch is a DOLLAR cap (--max-budget-usd); there is
# no --max-turns/--tokens CLI flag. State a soft turn cap in each plan's ## Constraints.
MAX_BUDGET_USD="2.00"            # hard $ cap per plan (empty = no cap)
TIMEOUT="35m"                    # wall-clock kill; needs timeout/gtimeout, else $-cap only

# --- Fleet ------------------------------------------------------
MAX_PARALLEL=3                   # concurrent plans / worktrees
BASE_BRANCH="main"               # diffs + worktrees branch off this
# Where git worktrees are created. Empty = "<repo-parent>/wt" (one tidy folder beside
# the repo, e.g. ~/Claude/dev/wt/) instead of scattering wt-* siblings in the dev dir.
# Set an absolute path to send them elsewhere (e.g. WORKTREE_DIR="$HOME/.cache/loop-wt").
WORKTREE_DIR=""

# --- Permissions for headless runs ------------------------------
# acceptEdits = auto-accept file edits, still gated by hooks.
# Use bypassPermissions ONLY in throwaway containers.
PERMISSION_MODE="acceptEdits"

name: agent-loop
# Unattended mode (GitHub Actions). triage.sh runs INTAKE (inbox → draft plans) then
# the FLEET (status: ready plans only — drafts wait for human review). The local
# equivalent is `loop/schedule.sh install` (launchd/cron).
# Requires a repo secret with auth for your LOOP_TOOL (ANTHROPIC_API_KEY for claude,
# OPENAI_API_KEY for codex, etc.).
# NOTE: across fresh CI runners, intake's .intake.sha markers (gitignored, local) don't
# persist → intake re-plans each run. For CI idempotency, commit portable markers (follow-up).

on:
  schedule:
    - cron: "0 9 * * 1-5"      # 09:00 UTC, weekdays
  workflow_dispatch: {}

concurrency:
  group: agent-loop
  cancel-in-progress: false      # never run two fleets at once

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history for worktrees/diffs

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      # Install your project's toolchain here (node/python/etc.)
      # - uses: actions/setup-node@v4
      #   with: { node-version: 20 }
      # - run: npm ci

      - name: Run fleet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name  "agent-loop"
          git config user.email "agent-loop@users.noreply.github.com"
          chmod +x loop/*.sh
          ./loop/triage.sh

      - name: Push loop branches
        run: git push origin --all || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: loop-logs, path: loop/logs/ }
